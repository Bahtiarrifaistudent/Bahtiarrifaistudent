# Simpan file ini di repo Bahtiarrifaistudent/Bahtiarrifaistudent
# pada path: .github/workflows/snake.yml
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # setiap hari jam 07.00 WIB
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#9333EA&color_dots=#F3E8FF,#E9D5FF,#D8B4FE,#C084FC,#9333EA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E879F9&color_dots=#161B22,#3B0764,#6D28D9,#A855F7,#E879F9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
